[project]
name = "reef-worker"
version = "0.1.0"
description = "reef-console's worker: the only client of the Apex Classic"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
